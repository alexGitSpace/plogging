<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Latest events</title>
<style>
  :root {
    --bg: #f7f7f5; --fg: #1d1d1b; --muted: #6b6b66; --line: #e2e2dc; --card: #fff;
    --pick: #1f7a4d; --sighting: #a65e00; --track: #3559b0; --session: #6b4fa8; --bad: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --fg: #ececea; --muted: #9a9a94; --line: #2c2c2a; --card: #1e1e1c;
      --pick: #5cc98f; --sighting: #f0a541; --track: #8aa8f0; --session: #b79cf0; --bad: #f2867e;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.4 system-ui, -apple-system, sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; margin-bottom: 16px; }
  h1 { font-size: 20px; margin: 0; }
  #status { color: var(--muted); font-size: 13px; }
  #status.bad { color: var(--bad); }
  table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  td.time { font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.details { color: var(--muted); word-break: break-word; }
  .type { font-weight: 600; white-space: nowrap; }
  .type.pick { color: var(--pick); }
  .type.sighting { color: var(--sighting); }
  .type.track\.points { color: var(--track); }
  .type.session\.start, .type.session\.end { color: var(--session); }
  tr.new { animation: flash 1.5s ease-out; }
  @keyframes flash { from { background: color-mix(in srgb, var(--pick) 25%, transparent); } }
  .empty { padding: 24px; text-align: center; color: var(--muted); }
  @media (max-width: 560px) { th.device, td.device { display: none; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Latest events</h1>
    <span id="status">loading…</span>
  </header>
  <table>
    <thead><tr><th>Time</th><th>Type</th><th class="device">Device</th><th>Details</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</main>
<script>
  const LIMIT = 50, EVERY_MS = 2000;
  const rows = document.getElementById("rows");
  const status = document.getElementById("status");
  let seen = null;

  const short = (id) => String(id).slice(0, 8);
  const pct = (x) => Math.round(Number(x) * 100) + "%";

  function details(e) {
    switch (e.type) {
      case "sighting": return `${e.litter_type} at ${e.lat}, ${e.lon} · confidence ${pct(e.confidence)}`;
      case "track.points": return `${e.points.length} points · session ${short(e.session_id)}`;
      case "session.start":
        return `${e.role} ${e.user_id} · devices ${e.device_ids.join(", ") || "none"} · session ${short(e.session_id)}`;
      case "session.end": return `session ${short(e.session_id)}`;
      default: return "";
    }
  }

  function cell(text, cls) {
    const td = document.createElement("td");
    if (cls) td.className = cls;
    td.textContent = text;
    return td;
  }

  function render(events) {
    const ids = new Set(events.map((e) => e.event_id));
    rows.replaceChildren();
    if (!events.length) {
      const td = cell("No events yet. POST some to /api/events.", "empty");
      td.colSpan = 4;
      rows.append(document.createElement("tr"));
      rows.lastChild.append(td);
    }
    for (const e of events) {
      const tr = document.createElement("tr");
      if (seen && !seen.has(e.event_id)) tr.className = "new";
      const type = cell(e.type, "type " + e.type);
      tr.append(cell(new Date(e.t).toLocaleTimeString(), "time"), type, cell(e.device_id, "device"),
                cell(details(e), "details"));
      rows.append(tr);
    }
    seen = ids;
  }

  async function tick() {
    try {
      const res = await fetch(`api/events?limit=${LIMIT}`, { cache: "no-store" });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      render((await res.json()).events);
      status.className = "";
      status.textContent = `updated ${new Date().toLocaleTimeString()} · every ${EVERY_MS / 1000} s`;
    } catch (err) {
      status.className = "bad";
      status.textContent = `cannot reach the API: ${err.message}`;
    }
    setTimeout(tick, EVERY_MS);
  }
  tick();
</script>
</body>
</html>
