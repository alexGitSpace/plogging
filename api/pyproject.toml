[project]
name = "api"
version = "0.1.0"
description = "Plokka API: receives events from all parts and serves them"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.5",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false
exclude-newer = "1 day"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
